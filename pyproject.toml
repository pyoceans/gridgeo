[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=42", "setuptools-scm" ]

[project]
name = "gridgeo"
description = "Convert UGRID, SGRID, and non-compliant ocean model grids to geo-like objects"
readme = "README.md"
license = { text = "BSD-3-Clause" }
maintainers = [ { email = "ocefpaf@gmail.com" }, { name = "Filipe Fernandes" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [
  "docopt",
  "matplotlib",
  "netcdf4",
  "numpy>=2",
  "shapely>=2",
]
optional-dependencies.extras = [
  "fiona",
]
urls.documentation = "https://pyoceans.github.io/gridgeo"
urls.homepage = "https://github.com/pyoceans/gridgeo"
urls.repository = "https://github.com/pyoceans/gridgeo"
entry-points.console_scripts.gridio = "gridgeo.gridio:main"

[dependency-groups]
dev = [
  "cartopy",
  "folium",
  "hypothesis",
  "nbsphinx",
  "pooch",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "sphinx",
]

[tool.setuptools]
packages = [ "gridgeo" ]
platforms = [ "any" ]
license-files = [ "LICENSE.txt" ]
zip-safe = true

[tool.setuptools_scm]
tag_regex = "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"
write_to = "gridgeo/_version.py"
write_to_template = "__version__ = '{version}'"

[tool.pytest]
ini_options.addopts = "-s -rxs -v"
ini_options.filterwarnings = [
  "error",
  "ignore::UserWarning",
]

[check-manifest]
ignore = [
  "*.yml",
  ".coveragerc",
  "docs",
  "docs/*",
  "notebooks",
  "notebooks/*",
  "tests",
  "tests/*",
]
